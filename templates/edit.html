<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
        <title>ToDoList</title>
    </head>
    <body>
        <h2>タスク編集</h2>
        <form method="POST" action="/edit/{{ task[0] }}">
            <div class="form-group">
                <label for="edit_task">タスクを編集してください</label>
                <input type="text" id="edit_task" name="edit_task" value="{{ task[1] }}">
            </div>
            <div class="form-group">
                <button type="submit">編集する</button>
            </div>
        </form>
        {% if message %}
            {{ message }}
        {% endif %}
    </body>
</html>
