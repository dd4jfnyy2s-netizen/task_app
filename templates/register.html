<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
        <title>ユーザー登録</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 600px;
                margin: 40px auto;
                padding: 20px;
            }
            
            h1, h2 {
                margin-bottom: 20px;
            }

            .form-group {
                margin-bottom: 15px;
            }

            label {
                display: block;
                margin-bottom: 5px;
            }

            input {
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            }

            button {
                padding: 8px 16px;
                cursor: pointer;
            }

            ul {
                padding: 0;
            }

            li {
                list-style: none;
                margin-bottom: 15px;
                padding: 10px;
                border: 1px solid #ccc;
            }

            a {
                margin-left: 10px;
            }
        </style>
    </head>
    <body>
        <h2>新規登録</h2>
        <form method="POST" action="/register">
            <div class="form-group">
                <label for="user_name">Username</label>
                <input type="text" id="user_name" name="user_name">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
            </div>
            <div class="form-group">
                <button type="submit">登録する</button>
            </div>
            <p>
                すでにアカウントをお持ちですか？
                <a href="/login">ログインはこちら</a>
            </p>
        </form>
        {% if message %}
            {{ message }}
        {% endif %}
    </body>
</html>
